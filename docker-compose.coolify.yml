version: '3.8'

services:
  web:
    build:
      context: https://github.com/flowautomation6677/Adult.git#main
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: "postgresql://admin:password123@postgres:5432/genapp?schema=public"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "admin_minio"
      MINIO_SECRET_KEY: "password123"
      MINIO_REGION: "us-east-1"
      MINIO_BUCKET_NAME: "inputs"
    ports:
      - "3000"
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: genapp
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: pgsty/silo:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin_minio
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
